<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Millbrook Market Gazette: newsletter</title>
    <style>
      body { margin: 0; padding: 24px 0 0; font-family: Georgia, serif; line-height: 1.6; color: #1d1d1b; background: #fbfaf6; }
      main { max-width: 520px; margin: 0 auto; padding: 0 16px 96px; }
      h1 { font-size: 2rem; margin: 0 0 0.5rem; }
      label { display: block; margin: 1rem 0 0.25rem; }
      input, button { font: inherit; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <main>
      <h1>The Saturday letter</h1>
      <p>One short email a week: what is in season, which stalls moved, and who brought the good cheese.</p>
      <form action="thanks.html">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <button type="submit">Sign up</button>
      </form>

      <!--
        Two "analytics" scripts that fingerprint the visitor the moment the email field takes focus:
        canvas text, an offline audio render and a font-probing sweep.
        The first host is a real tracker domain (AdTheorent, Tracker Radar fingerprinting score 0);
        the second is in no tracker list. The e2e browser maps both to the local fixture server (e2e/fixtures.ts).
      -->
      <script src="http://adentifi.com:4321/t/fp.js"></script>
      <script src="http://nightowl-metrics.test:4321/t/fp.js"></script>
    </main>
  </body>
</html>
